services:

  # ---------------------------------------------------------------
  # SQL Server
  # ---------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    hostname: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"   # obrigatório para os jobs de captura do CDC
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - cdc-network

  # ---------------------------------------------------------------
  # Job de inicialização: cria o banco, a tabela pessoa e habilita CDC
  # ---------------------------------------------------------------
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sqlserver-init:/scripts
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    networks:
      - cdc-network

  localstack:
    image: localstack/localstack:3.6
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./localstack/init-sns.sh:/etc/localstack/init/ready.d/init-sns.sh:ro

  debezium-server:
    image: quay.io/debezium/server:3.6.0.Final
    container_name: debezium-server
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
    volumes:
      - ./debezium-server/conf/application.properties:/debezium/config/application.properties:ro
      - debezium-data:/debezium/data
    restart: unless-stopped
    networks:
      - cdc-network

networks:
  cdc-network:
    driver: bridge

volumes:
  sqlserver-data:
  debezium-data:
